version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15.15-alpine  # Match AWS RDS version for consistency
    container_name: predico-postgres
    environment:
      POSTGRES_USER: predico_user
      POSTGRES_PASSWORD: predico_password
      POSTGRES_DB: predico_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predico_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - predico-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: predico-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - predico-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: predico-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://predico_user:predico_password@postgres:5432/predico_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      DEBUG: "True"
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # Run migrations then start server
    # Note: We need to wait a bit for postgres to be fully ready
    command: sh -c "sleep 3 && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - predico-network

volumes:
  postgres_data:
  redis_data:

networks:
  predico-network:
    driver: bridge

