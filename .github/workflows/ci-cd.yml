name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - staging
  pull_request:
    branches:
      - main
      - develop
      - staging

env:
  AWS_REGION: eu-north-1  # Stockholm, Sweden
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run backend tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
        run: |
          pytest tests/ -v
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test -- --watchAll=false || true  # Tests not set up yet
      
      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint || true

  build-and-push:
    name: Build and Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi
      
      - name: Build, tag, and push backend image
        env:
          ECR_REPOSITORY: predico-${{ steps.env.outputs.environment }}-backend
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./backend
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
        id: backend-image
      
      - name: Build, tag, and push frontend image
        env:
          ECR_REPOSITORY: predico-${{ steps.env.outputs.environment }}-frontend
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./frontend
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
        id: frontend-image

  deploy-dev:
    name: Deploy to Dev
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: dev
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
      
      - name: Terraform Init
        working-directory: ./infrastructure/terraform
        run: |
          terraform init -backend-config=envs/dev/backend.hcl
      
      - name: Terraform Plan
        working-directory: ./infrastructure/terraform
        run: |
          terraform plan -var-file=envs/dev/terraform.tfvars -out=tfplan
      
      - name: Terraform Apply
        working-directory: ./infrastructure/terraform
        run: |
          terraform apply -auto-approve tfplan
      
      - name: Update ECS Service
        env:
          ENV: ${{ steps.env.outputs.environment }}
        run: |
          aws ecs update-service \
            --cluster predico-${ENV}-cluster \
            --service predico-${ENV}-backend-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} || echo "Backend service update skipped"
          
          aws ecs update-service \
            --cluster predico-${ENV}-cluster \
            --service predico-${ENV}-frontend-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} || echo "Frontend service update skipped"

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    environment: staging
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
      
      - name: Terraform Init
        working-directory: ./infrastructure/terraform
        run: |
          terraform init -backend-config=envs/staging/backend.hcl
      
      - name: Terraform Plan
        working-directory: ./infrastructure/terraform
        run: |
          terraform plan -var-file=envs/staging/terraform.tfvars -out=tfplan
      
      - name: Terraform Apply
        working-directory: ./infrastructure/terraform
        run: |
          terraform apply -auto-approve tfplan
      
      - name: Update ECS Service
        env:
          ENV: ${{ steps.env.outputs.environment }}
        run: |
          aws ecs update-service \
            --cluster predico-${ENV}-cluster \
            --service predico-${ENV}-backend-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} || echo "Backend service update skipped"
          
          aws ecs update-service \
            --cluster predico-${ENV}-cluster \
            --service predico-${ENV}-frontend-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} || echo "Frontend service update skipped"

  deploy-production:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: 
      name: production
      url: https://yourdomain.com  # Update with your domain
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
      
      - name: Terraform Init
        working-directory: ./infrastructure/terraform
        run: |
          terraform init -backend-config=envs/production/backend.hcl
      
      - name: Terraform Plan
        working-directory: ./infrastructure/terraform
        run: |
          terraform plan -var-file=envs/production/terraform.tfvars -out=tfplan
      
      - name: Terraform Apply (Requires Approval)
        working-directory: ./infrastructure/terraform
        run: |
          terraform apply -auto-approve tfplan
      
      - name: Update ECS Service
        env:
          ENV: ${{ steps.env.outputs.environment }}
        run: |
          aws ecs update-service \
            --cluster predico-${ENV}-cluster \
            --service predico-${ENV}-backend-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} || echo "Backend service update skipped"
          
          aws ecs update-service \
            --cluster predico-${ENV}-cluster \
            --service predico-${ENV}-frontend-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} || echo "Frontend service update skipped"

